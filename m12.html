.rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);transition:.2s}
.opt.sel{border-color:var(--pri);background:var(--pri2);box-shadow:0 6px 16px -8px var(--pri)}.opt.sel .rd{border:6px solid var(--pri);animation:pop .3s}

.dot{flex:none;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}
.done .opt{cursor:default;opacity:.6}.done .opt.ok,.done .opt.bad{opacity:1}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .rd{border:6px solid var(--ok)}
.opt.bad{border-color:var(--no);background:var(--nob);animation:sk .4s}.opt.bad .rd{border:6px solid var(--no)}
.opt.ok::after,.opt.bad::after{content:'✓';margin-inline-start:auto;font-weight:700;color:var(--ok)}.opt.bad::after{content:'✗';color:var(--no)}
@keyframes sk{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.sub.miss{animation:ms 1.4s}@keyframes ms{0%,60%{background:var(--wnb)}}

.chart{margin:4px 0 10px}.chart svg{display:block;width:100%;touch-action:pan-y;cursor:crosshair;direction:ltr}
.gr{stroke:var(--line)}.ax{stroke:var(--mut);stroke-width:1.5}.tk{fill:var(--mut);font:11px Cairo,sans-serif}.at{fill:var(--ink);font:700 12px Cairo,sans-serif}

.go .cv{animation:dr 1.6s ease forwards}.p .cv{stroke-dashoffset:0}@keyframes dr{to{stroke-dashoffset:0}}
.dts,.hg{opacity:0}.go .dts,.go .hg{opacity:1;transition:opacity .6s 1.5s}.p .dts,.p .hg{opacity:1}
.lbl{font:700 12px Cairo,sans-serif}.gd{stroke:var(--hl);stroke-width:1.8;stroke-dasharray:5 4}
.bg rect{fill:var(--hl)}.bg text{fill:var(--onhl);font:700 12px Cairo,sans-serif}.hl{fill:var(--hl);font:700 12.5px Cairo,sans-serif}
.pl{fill:none;stroke:var(--hl);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pu 1.8s ease-out infinite}@keyframes pu{from{transform:scale(.6);opacity:1}to{transform:scale(2.6);opacity:0}}
.xh{stroke:var(--mut);stroke-width:1;stroke-dasharray:2 3}
.ro{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:13px;margin-top:8px}.ro span{padding:2px 10px;border-radius:99px;border:1.5px solid var(--c,var(--line))}.ro .tt{background:var(--pri2);border-color:transparent;font-weight:700}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--mut)}
.btn{width:100%;min-height:56px;font:700 18px Cairo,sans-serif;border:0;border-radius:16px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#0a7cb0,#0a9a8a);box-shadow:var(--sh);transition:transform .15s,filter .2s}
.btn:active{transform:scale(.98)}.btn:hover{filter:brightness(1.08)}.btn.rt{background:linear-gradient(135deg,#d98a06,#d9480f);margin-top:14px}
#res{display:none;text-align:center}#res.show{display:block;animation:up .6s both}@keyframes up{from{opacity:0;transform:translateY(20px)}}
.rw{position:relative;width:140px;margin:auto}.ring{width:140px;display:block;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.rb{stroke:var(--line)}
.rf{stroke:var(--c);stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.rn{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:700}
#res h2{margin:10px 0 0}#res p{margin:4px 0}.st{font-size:14px;color:var(--mut)}

const Q=[
{t:'اختر المصطلح العلمي المناسب لكل تعريف:',p:4,s:[

['3- محلول يحتوي على كمية من المذاب أقل من الكمية اللازمة للإشباع.','المحلول غير المشبع',T4,'غير المشبع يحتوي مذاباً أقل من حد الإشباع.'],

{t:'تستخدم إحدى المواد ككاشف لمعرفة نوعية المحاليل، حيث يتغير لون الكاشف في كل منها كما يلي:',p:4,

{t:'فتح محمد عبوة مشروب غازي كانت خارج الثلاجة عدة ساعات. لاحظ خروج كمية كبيرة من الفقاعات عند فتح العبوة. فسر هذه الملاحظة علمياً:',p:1,s:[

{t:'يريد طالب إذابة السكر بسرعة في كوب ماء. اختر طريقتين تساعدانه على زيادة سرعة الذوبان:',p:2,s:[
['الطريقة الأولى:','تحريك المحلول (التقليب)',['تحريك المحلول (التقليب)','تبريد الماء بالثلج','استخدام مكعبات سكر كبيرة الحجم'],'التحريك يزيد تصادم جزيئات الماء بالسكر فتزداد سرعة الذوبان.'],
['الطريقة الثانية:','رفع درجة حرارة الماء وتفتيت السكر إلى أجزاء أصغر',['رفع درجة حرارة الماء وتفتيت السكر إلى أجزاء أصغر','ترك الكوب بدون تحريك في مكان بارد','تقليل كمية الماء في الكوب'],'الحرارة وتصغير الحبيبات يزيدان سرعة الذوبان.']]},
{t:'لماذا يفضل حفظ المشروبات الغازية باردة؟',p:1,s:[
['','لأن انخفاض درجة الحرارة يزيد ذوبانية غاز ثاني أكسيد الكربون في المشروب، فيبقى الغاز مذاباً مدة أطول',['لأن البرودة تقلل من ذوبانية الغازات فيخرج الغاز من العبوة','لأن البرودة تزيد من ذوبانية السكر الصلب في المشروب'],'']]},
{t:'تعتمد مملكة البحرين على تحلية مياه البحر. كيف يمكن استخدام الطاقة الشمسية للحصول على ماء عذب من ماء البحر بطريقة صديقة للبيئة؟',p:1,s:[
['','تستخدم الطاقة الشمسية لتسخين ماء البحر وتبخيره، ثم يُكثف بخار الماء للحصول على ماء عذب وتبقى الأملاح منفصلة',['تجميد ماء البحر بواسطة الطاقة الشمسية ثم طحن الجليد الملحي','إضافة أحماض قوية لماء البحر تحت أشعة الشمس لإذابة الملح'],'']]}
];

/* ===== الرسم البياني ===== */
const TT=[10,20,30,40,50,60,70,80,90];
const CV=[['سكروز',[190,204,220,238,260,280,320,362,420]],['كلوريد البوتاسيوم',[31,34,37,40,43,46,48,51,54]],['كلوريد الصوديوم',[35.7,35.8,36,36.3,36.7,37.1,37.5,38,38.5]],['كربونات الكالسيوم',[2,2,2,2,2,2,2,2,2]]];
let played=0,cur=60,lastW=0;
const sm=P=>{let d='M'+P[0];for(let i=0;i<P.length-1;i++){const a=P[i-1]||P[i],b=P[i],c=P[i+1],e=P[i+2]||c;d+=` C${b[0]+(c[0]-a[0])/6},${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6},${c[1]-(e[1]-b[1])/6} ${c}`}return d};
function chart(){
 const box=$('chart');if(!box)return;
 const W=Math.max(300,box.clientWidth),H=W<520?340:400,L=56,R=14,T=14,B=46,pw=W-L-R,ph=H-T-B;lastW=box.clientWidth;
 const X=t=>L+(t-5)/90*pw,Y=v=>T+ph-v/480*ph;
 let g='';
 for(let v=0;v<=480;v+=40)g+=`<line class="gr" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tk" x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
 TT.forEach(t=>g+=`<text class="tk" x="${X(t)}" y="${Y(0)+17}" text-anchor="middle">${t}</text>`);
 g+=`<line class="ax" x1="${L}" x2="${L}" y1="${T}" y2="${Y(0)}"/><line class="ax" x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
 g+=`<text class="at" x="${L+pw/2}" y="${H-5}" text-anchor="middle">درجة الحرارة (س°)</text><text class="at" transform="translate(11 ${T+ph/2}) rotate(-90)" text-anchor="middle">الذوبانية (جم مذاب / 100 جم ماء)</text>`;
 let dt='';
 CV.forEach(([n,d],k)=>{const P=TT.map((t,i)=>[X(t),Y(d[i])]);
  g+=`<path class="cv" pathLength="1" d="${sm(P)}" style="stroke:var(--c${k});animation-delay:${k*.25}s"/>`;
  dt+=P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" style="fill:var(--c${k})"/>`).join('')});
 const e=i=>[X(90),Y(CV[i][1][8])];
 dt+=`<text class="lbl" x="${e(0)[0]}" y="${e(0)[1]-9}" text-anchor="end" style="fill:var(--c0)">سكروز</text><text class="lbl" x="${e(1)[0]}" y="${e(1)[1]-9}" text-anchor="end" style="fill:var(--c1)">كلوريد البوتاسيوم</text><text class="lbl" x="${e(2)[0]}" y="${e(2)[1]+16}" text-anchor="end" style="fill:var(--c2)">كلوريد الصوديوم</text><text class="lbl" x="${X(14)}" y="${Y(2)-8}" style="fill:var(--c3)">كربونات الكالسيوم</text>`;
 g+=`<g class="dts">${dt}</g>`;
 const x6=X(60),y6=Y(280),y0=Y(0);
 g+=`<g class="hg"><line class="gd" x1="${x6}" x2="${x6}" y1="${y0}" y2="${y6}"/><line class="gd" x1="${L}" x2="${x6}" y1="${y6}" y2="${y6}"/><g class="bg"><rect x="${L-38}" y="${y6-11}" width="40" height="22" rx="8"/><text x="${L-18}" y="${y6+4.5}" text-anchor="middle">280</text></g><g class="bg"><rect x="${x6-17}" y="${y0+4}" width="34" height="20" rx="8"/><text x="${x6}" y="${y0+18.5}" text-anchor="middle">60</text></g><circle class="pl" cx="${x6}" cy="${y6}" r="6"/><circle cx="${x6}" cy="${y6}" r="5.5" style="fill:var(--hl);stroke:var(--card);stroke-width:2"/><text class="hl" x="${x6-12}" y="${y6-12}" text-anchor="end">عند 60 س° ← 280 جم</text></g>`;
 g+=`<line class="xh" id="xh" y1="${T}" y2="${y0}"/>`;
 box.innerHTML=`<svg id="svg" class="${played?'p':''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنيات ذوبانية السكروز وكلوريد البوتاسيوم وكلوريد الصوديوم وكربونات الكالسيوم مع درجة الحرارة">${g}</svg><div class="ro" id="ro"></div><p class="hint">المس الرسم أو مرّر عليه لقراءة الذوبانية عند أي درجة حرارة.</p>`;
 const svg=$('svg'),setT=t=>{cur=t;const x=X(t);$('xh').setAttribute('x1',x);$('xh').setAttribute('x2',x);const i=TT.indexOf(t);$('ro').innerHTML=`<span class="tt">عند ${t} س°</span>`+CV.map(([n,d],k)=>`<span style="--c:var(--c${k})">${n} <b>${k==3?'≈ 0':Math.round(d[i])}</b></span>`).join('')};
 svg.onpointermove=svg.onpointerdown=ev=>{const r=svg.getBoundingClientRect(),xu=(ev.clientX-r.left)*W/r.width;setT(Math.min(90,Math.max(10,Math.round((5+(xu-L)/pw*90)/10)*10)))};
 setT(cur);
}
const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);
 if(el.classList.contains('rv'))el.classList.add('in');
 if(el.id==='chart'){played=1;const s=$('svg');if(s&&!s.classList.contains('p'))s.classList.add('go')}}),{threshold:.3});
const rz=new ResizeObserver(()=>{const b=$('chart');if(b&&Math.abs(b.clientWidth-lastW)>2)chart()});

/* ===== بناء الاختبار ===== */
let S=[],locked=false;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ptl=p=>p==1?'درجة':p==2?'درجتان':p+' درجات';
function build(){
 S=[];locked=false;
 $('qs').innerHTML=Q.map((q,qi)=>`<section class="card rv"><header><b class="no">${qi+1}</b><h3>${q.t}</h3><span class="pt">${ptl(q.p)}</span></header>${q.i||''}${q.c?'<div class="chart" id="chart"></div>':''}${q.s.map(([l,a,o,e])=>{
  const op=shuf([a,...o.filter(v=>v!==a)]),id=S.length;S.push({a,e,op,ci:op.indexOf(a),sel:-1});
  return `<div class="sub">${l?`<div class="lb">${l}</div>`:''}<div class="opts${op.some(v=>v.length>24)?' long':''}" role="radiogroup" data-s="${id}">${op.map((v,i)=>`<button type="button" role="radio" aria-checked="false" class="opt" data-i="${i}"><span class="rd"></span>${COL[v]?`<i class="dot" style="background:${COL[v]}"></i>`:''}<span>${v}</span></button>`).join('')}</div><div class="fb"><div></div></div></div>`}).join('')}</section>`).join('');
 document.querySelectorAll('.card.rv').forEach(c=>io.observe(c));
 const b=$('chart');if(b){played=0;chart();io.observe(b);rz.disconnect();rz.observe(b)}
 prog();
}
const prog=()=>{const n=S.filter(s=>s.sel>=0).length;$('cnt').textContent=`${n} / ${S.length}`;$('pg').style.width=n/S.length*100+'%'};
let tm;const toast=m=>{const t=$('ts');t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),2600)};
$('qs').onclick=e=>{const b=e.target.closest('.opt');if(!b||locked)return;const g=b.parentNode;S[g.dataset.s].sel=+b.dataset.i;
 [...g.children].forEach(c=>{c.classList.toggle('sel',c===b);c.setAttribute('aria-checked',c===b)});g.parentNode.classList.remove('miss');prog();navigator.vibrate&&navigator.vibrate(8)};

/* ===== التصحيح والنتيجة ===== */
const esc=s=>s.replace(/[<>&"']/g,c=>'&#'+c.charCodeAt(0)+';');
$('f').onsubmit=e=>{e.preventDefault();if(locked)return;
 const nm=$('nm').value.trim(),cl=$('cl').value.trim();
 if(!nm||!cl){const el=nm?$('cl'):$('nm');el.classList.remove('err');void el.offsetWidth;el.classList.add('err');el.focus();el.scrollIntoView({behavior:'smooth',block:'center'});toast('اكتب اسمك وصفّك أولاً');return}
 const m=S.findIndex(s=>s.sel<0);
 if(m>=0){const el=document.querySelectorAll('.sub')[m];el.classList.add('miss');el.scrollIntoView({behavior:'smooth',block:'center'});toast(`بقي ${S.filter(s=>s.sel<0).length} سؤال بلا إجابة`);return}
 locked=true;let sc=0;const els=document.querySelectorAll('.sub');
 S.forEach((s,i)=>{const el=els[i],ops=el.querySelectorAll('.opt'),ok=s.sel===s.ci;sc+=ok;
  el.querySelector('.opts').classList.add('done');ops[s.ci].classList.add('ok');if(!ok)ops[s.sel].classList.add('bad');
  const fb=el.querySelector('.fb');fb.firstChild.innerHTML=`<p class="${ok?'g':'r'}">${ok?'✔ إجابة صحيحة. ':`✘ الإجابة الصحيحة: <b>${s.a}</b>. `}${s.e||''}</p>`;fb.classList.add('on')});
 const n=S.length,pc=Math.round(sc/n*100),c=pc>=75?'--ok':pc>=50?'--wn':'--no',msg=pc>=90?'ممتاز! 🌟':pc>=75?'جيد جداً 👏':pc>=50?'جيد، راجع الأخطاء 📘':'تحتاج مراجعة، أعد المحاولة 💪';
 const r=$('res');r.innerHTML=`<div class="rw"><svg class="ring" viewBox="0 0 120 120"><circle class="rb" cx="60" cy="60" r="52" pathLength="100"/><circle class="rf" id="rf" style="--c:var(${c})" cx="60" cy="60" r="52" pathLength="100"/></svg><div class="rn" id="rn">0</div></div><h2>${msg}</h2><p>درجتك يا ${esc(nm)} (${esc(cl)}) هي <b>${sc}</b> من ${n}</p><p class="st" id="st"></p><button class="btn rt" id="rt" type="button">إعادة الاختبار 🔄</button>`;
 r.classList.add('show');$('sb').hidden=true;r.scrollIntoView({behavior:'smooth',block:'center'});
 requestAnimationFrame(()=>requestAnimationFrame(()=>{$('rf').style.strokeDashoffset=100-pc;const t0=performance.now(),tk=t=>{const k=Math.min(1,(t-t0)/1400);$('rn').textContent=Math.round(sc*(1-Math.pow(1-k,3)));k<1&&requestAnimationFrame(tk)};requestAnimationFrame(tk)}));
 $('rt').onclick=()=>{r.classList.remove('show');$('sb').hidden=false;build();scrollTo({top:0,behavior:'smooth'})};
 const st=$('st');
 if(GOOGLE_SCRIPT_URL){st.textContent='⏳ جاري حفظ النتيجة في سجل المعلم...';
  fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm,studentClass:cl,score:sc})})
  .then(()=>st.textContent='✅ تم حفظ نتيجتك في كشف درجات المعلم بنجاح!').catch(()=>st.textContent='⚠️ تعذر الاتصال بالسجل، ولكن تم عرض نتيجتك أعلاه.')}
 else st.textContent='ℹ️ (ملاحظة للمعلم: ضع رابط Apps Script لتفعيل الحفظ التلقائي)';
};

/* ===== الوضع الفاتح / الداكن ===== */
const th=$('th'),ic=()=>th.textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';
th.onclick=()=>{const d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}ic()};
ic();build();
</script>
</body>
</html>
